<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recetas Deliciosas</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#ff6b35;
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    margin-bottom:10px;
}

.buscador{
    width:80%;
    max-width:500px;
    padding:12px;
    border:none;
    border-radius:20px;
    font-size:16px;
}

.container{
    width:90%;
    margin:30px auto;
}

.recetas{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}

.card-content h3{
    color:#ff6b35;
    margin-bottom:10px;
}

.card-content p{
    color:#555;
    margin-bottom:15px;
}

button{
    background:#ff6b35;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#e85a2c;
}

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.7);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;
    width:90%;
    max-width:600px;
    padding:20px;
    border-radius:15px;
}

.close{
    float:right;
    font-size:25px;
    cursor:pointer;
    color:red;
}

ul{
    margin-left:20px;
    margin-top:10px;
}
</style>
</head>
<body>

<header>
    <h1>🍽️ Recetas Deliciosas</h1>
    <input type="text" id="buscar" class="buscador" placeholder="Buscar receta...">
</header>

<div class="container">
    <div class="recetas" id="listaRecetas"></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" onclick="cerrarModal()">&times;</span>
        <div id="detalleReceta"></div>
    </div>
</div>

<script>
const recetas = [
{
    nombre:"Pizza Casera",
    imagen:"https://images.unsplash.com/photo-1513104890138-7c749659a591",
    descripcion:"Deliciosa pizza preparada en casa.",
    ingredientes:[
        "Masa para pizza",
        "Queso mozzarella",
        "Salsa de tomate",
        "Pepperoni"
    ],
    preparacion:"Extiende la masa, añade salsa, queso y pepperoni. Hornea durante 20 minutos."
},
{
    nombre:"Hamburguesa",
    imagen:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd",
    descripcion:"Hamburguesa jugosa con ingredientes frescos.",
    ingredientes:[
        "Pan",
        "Carne",
        "Lechuga",
        "Tomate",
        "Queso"
    ],
    preparacion:"Cocina la carne, monta la hamburguesa y sirve caliente."
},
{
    nombre:"Ensalada César",
    imagen:"https://images.unsplash.com/photo-1546793665-c74683f339c1",
    descripcion:"Ensalada fresca y saludable.",
    ingredientes:[
        "Lechuga romana",
        "Pollo",
        "Queso parmesano",
        "Aderezo César"
    ],
    preparacion:"Mezcla todos los ingredientes y añade el aderezo."
},
{
    nombre:"Pasta Alfredo",
    imagen:"https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9",
    descripcion:"Pasta cremosa con salsa Alfredo.",
    ingredientes:[
        "Pasta",
        "Crema de leche",
        "Mantequilla",
        "Queso parmesano"
    ],
    preparacion:"Cocina la pasta y mezcla con la salsa Alfredo."
}
];

const lista = document.getElementById("listaRecetas");

function mostrarRecetas(datos){
    lista.innerHTML = "";

    datos.forEach(receta => {
        lista.innerHTML += `
        <div class="card">
            <img src="${receta.imagen}" alt="${receta.nombre}">
            <div class="card-content">
                <h3>${receta.nombre}</h3>
                <p>${receta.descripcion}</p>
                <button onclick="verReceta('${receta.nombre}')">
                    Ver receta
                </button>
            </div>
        </div>
        `;
    });
}

function verReceta(nombre){
    const receta = recetas.find(r => r.nombre === nombre);

    document.getElementById("detalleReceta").innerHTML = `
        <h2>${receta.nombre}</h2>
        <h3>Ingredientes</h3>
        <ul>
            ${receta.ingredientes.map(i => `<li>${i}</li>`).join("")}
        </ul>

        <h3 style="margin-top:15px;">Preparación</h3>
        <p>${receta.preparacion}</p>
    `;

    document.getElementById("modal").style.display = "flex";
}

function cerrarModal(){
    document.getElementById("modal").style.display = "none";
}

document.getElementById("buscar").addEventListener("keyup", function(){
    const texto = this.value.toLowerCase();

    const filtradas = recetas.filter(receta =>
        receta.nombre.toLowerCase().includes(texto)
    );

    mostrarRecetas(filtradas);
});

mostrarRecetas(recetas);
</script>

</body>
</html>
